[files]
extend-exclude = [
    "test_data/"
]

[default]
binary = false
check-filename = true
check-file = true
unicode = true
locale = "en-us"
extend-ignore-re = [
    # Ignore a line that is preceded with `# typos:ignore`
    "(#|//)\\s*typos:ignore\\n.*",

    # Ignore code blocks between `# typos:disable` and `# typos:enable`
    "(?s)(#|//)\\s*typos:disable.*?\\n\\s*(#|//)\\s*typos:enable",

    # Ignore text between <!-- typos:disable --> and <!-- typos:enable -->
    "(?s)<!--\\s*typos:disable\\s*-->.*?<!--\\s*typos:enable\\s*-->",

    # Ignore 'rpmbuild_flags="-ba"'
    'rpmbuild_flags="-ba"',

    # Ignore "Ned Batchelder"
    "\\bNed Batchelder\\b",

    # Ignore "Yann Collet"
    "\\bYann Collet\\b",
]
extend-words = {
    "astroid" = "astroid",
    "certifi" = "certifi",
    "flor" = "flor",
}
